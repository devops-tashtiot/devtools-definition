# Overrides for Bitbucket Data Center 10.2.2 running on the minikube-on-EC2 cluster.
# Cloudflare tunnel: bitbucket.devopstashtiot.page → nginx-ingress → bitbucket

bitbucket:
  # This chart overloads ingress.https for two things: the K8s Ingress TLS
  # stanza (unused here — ssl-redirect is off, Cloudflare terminates TLS) AND
  # the SERVER_SCHEME/SERVER_SECURE/SERVER_PROXY_PORT/SETUP_BASEURL env vars
  # that tell Bitbucket it's reached over HTTPS at the edge. Leaving it false
  # (the devtools-provision default, matching every other tool's convention)
  # makes Bitbucket compute its own base URL as http://, which mismatches the
  # browser's https:// Origin/Referer and trips its XSRF filter, silently
  # blocking login POSTs. Must be true here even though TLS isn't terminated
  # in-cluster.
  ingress:
    https: true

  # Base chart defaults (768m/512m heap, 3Gi container limit) were fine for
  # initial setup but leave no headroom once real repos/PR builds are hitting
  # it alongside Confluence and Jira on the same node. Bumped heap and
  # container ceiling; requests kept modest (node is a single t3.2xlarge,
  # 7 vCPU / 28Gi allocatable — see devtools-labs/terraform/live/devtools/minikube
  # /terragrunt.hcl) so Confluence + Bitbucket + Jira requests don't eat the
  # whole node and starve ArgoCD/ingress-nginx/Artifactory/SonarQube.
  bitbucket:
    resources:
      jvm:
        maxHeap: "1536m"
        minHeap: "1024m"
      container:
        requests:
          cpu: "750m"
          memory: "4Gi"
        limits:
          cpu: "3"
          memory: "5Gi"
    # Public access is globally disabled by default since Bitbucket DC 8.18 — this is the
    # only way to enable it (no REST endpoint; confirmed by 404s on /admin/permissions/anonymous
    # and /admin/settings against a SYS_ADMIN token). -D<property>=<value> JVM args map
    # directly to bitbucket.properties keys in Atlassian DC apps.
    # https://confluence.atlassian.com/bitbucketserver/allowing-public-access-to-code
    additionalJvmArgs:
      - "-Dfeature.public.access=true"

  database:
    url: "jdbc:postgresql://devtools-rds.cdwso8c8c8zk.il-central-1.rds.amazonaws.com:5432/bitbucket"
  # Ensures the "bitbucket" database/role exist on the shared RDS instance
  # before Bitbucket starts — idempotent, safe to re-run on every pod start.
  # Replaces the old devtools-labs/terraform/live/devtools/rds-databases unit.
  additionalInitContainers:
    # Bitbucket's Mesh git-storage backend shells out to a real `git` binary
    # as the "bitbucket" user (uid 2003) to serve every git-over-HTTP
    # request (info/refs, clone, push, etc.). The repo data on the EFS-backed
    # shared-home volume is owned by uid 50000 (an ownership mismatch left
    # over from the EKS/EFS migration, not something this chart controls),
    # which trips git's own "detected dubious ownership" safety check
    # (CVE-2022-24765 mitigation) — git refuses to operate on a repo
    # directory it doesn't consider itself the owner of unless the path is
    # explicitly trusted via safe.directory. Bitbucket's own web app never
    # surfaces this as a normal exception (it happens inside Mesh's git
    # subprocess, decoded from raw gRPC HttpBackend response bytes), so
    # every git operation against ANY repo failed with a bare, unlogged 500
    # — confirmed live 2026-09-01 by decoding the actual gRPC payload
    # (io.grpc DEBUG logging) to find the real "fatal: detected dubious
    # ownership" message hiding inside it.
    #
    # Fix: trust every directory for git commands run as the "bitbucket"
    # user, via that user's own ~/.gitconfig (local-home is a real
    # persistent EBS volume, not ephemeral container filesystem, so this
    # normally survives pod restarts on its own — this initContainer exists
    # so a genuinely fresh local-home volume, e.g. after a full teardown/
    # disaster-recovery restore, self-heals the same way instead of hitting
    # this bug again on first boot).
    - name: ensure-git-safe-directory
      image: busybox:1.36
      securityContext:
        runAsUser: 2003
        runAsGroup: 2003
      command:
        - sh
        - -c
        - |
          set -eu
          if ! grep -q 'directory = \*' /var/atlassian/application-data/bitbucket/.gitconfig 2>/dev/null; then
            printf '[safe]\n\tdirectory = *\n' >> /var/atlassian/application-data/bitbucket/.gitconfig
          fi
      volumeMounts:
        - name: local-home
          mountPath: /var/atlassian/application-data/bitbucket
    - name: ensure-postgres-db
      image: postgres:17-alpine
      env:
        - name: PGHOST
          value: "devtools-rds.cdwso8c8c8zk.il-central-1.rds.amazonaws.com"
        - name: PGPORT
          value: "5432"
        - name: ADMIN_USER
          valueFrom:
            secretKeyRef:
              name: rds-admin-credentials
              key: username
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: rds-admin-credentials
              key: password
        - name: APP_DB_NAME
          value: "bitbucket"
      command:
        - /bin/sh
        - -c
        - |
          set -eu
          # Every devtool connects as the shared RDS admin user (see
          # rds-admin-credentials / bitbucket-db, both sourced from the same
          # SSM params) — no per-tool role, so nothing to CREATE ROLE or
          # GRANT here, just make sure the database itself exists.
          psql -h "$PGHOST" -p "$PGPORT" -U "$ADMIN_USER" -d postgres -v ON_ERROR_STOP=1 -tAc \
            "SELECT 1 FROM pg_database WHERE datname = '$APP_DB_NAME'" | grep -q 1 || \
          psql -h "$PGHOST" -p "$PGPORT" -U "$ADMIN_USER" -d postgres -v ON_ERROR_STOP=1 -c \
            "CREATE DATABASE \"$APP_DB_NAME\" OWNER \"$ADMIN_USER\";"
    # Downloads the Avisi Apps "User Directory API" plugin jar into
    # shared-home/plugins (see bitbucket.bitbucket.additionalBundledPlugins
    # in devtools-provision, which loads it from there as a bundled plugin).
    # Idempotent — skips the download if the jar already exists from a
    # previous pod start. Independent of nfsPermissionFixer (disabled below
    # for this devtool) — this is a separate init container, not a
    # nfsPermissionFixer custom command. Verified working, unauthenticated
    # direct download (200, application/java-archive) on 2026-08-27.
    - name: download-user-directory-api-plugin
      image: curlimages/curl:8.10.1
      command:
        - sh
        - -c
        - |
          set -eu
          mkdir -p /shared-home/plugins
          if [ ! -f /shared-home/plugins/nl.avisi.atlassian.stash.user-directory-api-1.1.9.jar ]; then
            curl -fsSL -o /shared-home/plugins/nl.avisi.atlassian.stash.user-directory-api-1.1.9.jar \
              "https://marketplace.atlassian.com/download/app/nl.avisi.atlassian.stash.user-directory-api/100190/DATACENTER/artifact"
          fi
      volumeMounts:
        - name: shared-home
          mountPath: /shared-home
  volumes:
    localHome:
      persistentVolumeClaim:
        storageClassName: gp3
    # ReadWriteMany — see the umbrella chart's own shared-home-pvc.yaml.
    # Needs the EFS-backed StorageClass; plain EBS can't satisfy RWX.
    sharedHome:
      storageClassName: efs-sc

wrapper:
  bitbucketSecrets:
    # License is stored in AWS SSM Parameter Store (SecureString), not here —
    # requires the external-secrets-operator devtool + ClusterSecretStore.
    licenseSsmParameter: "/devops/prerequisite/bitbucket/license"
    admin:
      username: admin
      displayName: "Admin"
      emailAddress: "netanelzucaim100@gmail.com"
    # Shared admin password across argocd/bitbucket/confluence.
    adminPasswordSsmParameter: "/devops/terraform-created/admin/password"

  rdsAdmin:
    usernameSsmParameter: "/devops/terraform-created/rds/admin-username"
    passwordSsmParameter: "/devops/terraform-created/rds/admin-password"

  # Cloudflare's public Origin CA root cert, published once for every devtool
  # by devtools-labs Terraform's devtools-secrets module.
  trustedCertsSsmParameter: "/devops/terraform-created/cloudflare/origin-ca-root-cert"
