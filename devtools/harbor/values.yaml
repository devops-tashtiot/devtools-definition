# EKS-specific overrides for Harbor 2.15.2.
# Merged on top of devtools-provision/devtools/harbor/values.yaml by ArgoCD.
# Cloudflare tunnel: harbor.devopstashtiot.page -> nginx-ingress -> harbor-core
#
# Note: Harbor OSS has no license concept, and its admin bootstrap is native to
# the chart (existingSecretAdminPassword) -- no manual setup wizard needed, unlike
# Confluence/Jira.
harbor:
  externalURL: https://harbor.devopstashtiot.page
  expose:
    ingress:
      hosts:
        core: harbor.devopstashtiot.page
  existingSecretAdminPassword: harbor-admin-password
  database:
    external:
      host: "devtools-rds.cdwso8c8c8zk.il-central-1.rds.amazonaws.com"
      port: "5432"
      username: "devtools"
      coreDatabase: "harbor"
      existingSecret: "rds-admin-credentials"
      sslmode: "require"
  core:
    initContainers:
      - name: ensure-postgres-db
        image: postgres:17-alpine
        env:
          - name: PGHOST
            value: "devtools-rds.cdwso8c8c8zk.il-central-1.rds.amazonaws.com"
          - name: PGPORT
            value: "5432"
          - name: ADMIN_USER
            valueFrom:
              secretKeyRef:
                name: rds-admin-credentials
                key: username
          - name: PGPASSWORD
            valueFrom:
              secretKeyRef:
                name: rds-admin-credentials
                key: password
          - name: APP_DB_NAME
            value: "harbor"
        command:
          - /bin/sh
          - -c
          - |
            set -eu
            psql -h "$PGHOST" -p "$PGPORT" -U "$ADMIN_USER" -d postgres -v ON_ERROR_STOP=1 -tAc \
              "SELECT 1 FROM pg_database WHERE datname = '$APP_DB_NAME'" | grep -q 1 || \
            psql -h "$PGHOST" -p "$PGPORT" -U "$ADMIN_USER" -d postgres -v ON_ERROR_STOP=1 -c \
              "CREATE DATABASE \"$APP_DB_NAME\" OWNER \"$ADMIN_USER\";"
  # jobservice also talks to postgres directly; give it the same idempotent
  # init container so it doesn't crash-loop waiting on core to create the DB first.
  jobservice:
    initContainers:
      - name: ensure-postgres-db
        image: postgres:17-alpine
        env:
          - name: PGHOST
            value: "devtools-rds.cdwso8c8c8zk.il-central-1.rds.amazonaws.com"
          - name: PGPORT
            value: "5432"
          - name: ADMIN_USER
            valueFrom:
              secretKeyRef:
                name: rds-admin-credentials
                key: username
          - name: PGPASSWORD
            valueFrom:
              secretKeyRef:
                name: rds-admin-credentials
                key: password
          - name: APP_DB_NAME
            value: "harbor"
        command:
          - /bin/sh
          - -c
          - |
            set -eu
            psql -h "$PGHOST" -p "$PGPORT" -U "$ADMIN_USER" -d postgres -v ON_ERROR_STOP=1 -tAc \
              "SELECT 1 FROM pg_database WHERE datname = '$APP_DB_NAME'" | grep -q 1 || \
            psql -h "$PGHOST" -p "$PGPORT" -U "$ADMIN_USER" -d postgres -v ON_ERROR_STOP=1 -c \
              "CREATE DATABASE \"$APP_DB_NAME\" OWNER \"$ADMIN_USER\";"

wrapper:
  rdsAdmin:
    usernameSsmParameter: "/devtools/rds/admin-username"
    passwordSsmParameter: "/devtools/rds/admin-password"
  adminPasswordSsmParameter: "/devtools/admin/password"
  # SSO against the shared RHBK instance (clusters-provision/clusters/rhbk's
  # harborClient) — see templates/configure-oidc-job.yaml for how this gets applied
  # via Harbor's own REST API. oidc_verify_cert is hardcoded false in that Job (not a
  # values field) — see the Job's header comment for why Harbor's API leaves no
  # better option than ArgoCD's rootCA / Confluence's trusted-certs approach.
  oidc:
    enabled: true
    name: "RHBK"
    endpoint: "https://rhbk.devopstashtiot.page/realms/devtools"
    clientId: "harbor"
    scope: "openid,profile,email,groups"
    userClaim: "preferred_username"
    groupClaim: "groups"
    adminGroup: "devops-tashtiot"
  oidcClientSecretSsmParameter: "/devtools/rhbk/oidc-client-secret"
