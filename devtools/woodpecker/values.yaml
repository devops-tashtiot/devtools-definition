# EKS-specific overrides for Woodpecker CI.
# Merged on top of devtools-provision/devtools/woodpecker/values.yaml by ArgoCD.
# Traffic: Cloudflare → cloudflared → nginx-ingress → woodpecker-server (ClusterIP).
# Forge: Bitbucket Data Center (already deployed on this platform, see
# devtools-definition/devtools/bitbucket) — see wrapper.bitbucketDcSecrets
# below for the one manual step this still requires.
# Prereq: add DNS CNAME woodpecker.devopstashtiot.page → 7de872ce-2826-42fb-9aea-325e10e3e5fc.cfargotunnel.com

woodpecker:
  server:
    env:
      WOODPECKER_HOST: "https://woodpecker.devopstashtiot.page"

    service:
      type: ClusterIP

    ingress:
      enabled: true
      ingressClassName: nginx
      annotations:
        nginx.ingress.kubernetes.io/ssl-redirect: "false"
      hosts:
        - host: woodpecker.devopstashtiot.page
          paths:
            - path: /
              pathType: Prefix

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

    # Trusts the Cloudflare Origin CA root cert (see wrapper.trustedCertsSsmParameter
    # / devtools-provision's templates/trusted-certs.yaml) so outbound calls to
    # bitbucket.devopstashtiot.page — OAuth2 token exchange, forge API — pass real
    # TLS verification instead of "x509: certificate signed by unknown authority".
    # Woodpecker's server image is FROM scratch with no shell/update-ca-certificates,
    # so the only way in is to build a combined bundle in an init container (which
    # does have a shell) and mount it whole over the main container's
    # /etc/ssl/certs/ca-certificates.crt. curlimages/curl already ships its own
    # /etc/ssl/certs/ca-certificates.crt (standard public CAs), so this appends our
    # one extra root onto that rather than needing a separate ca-certificates
    # install step.
    #
    # Ensures the "woodpecker" database exists on the shared RDS instance
    # before the server starts — idempotent, safe to re-run on every pod
    # start. Same pattern as bitbucket/confluence/jira's additionalInitContainers,
    # adapted to this chart's own server.initContainers field.
    initContainers:
      - name: trust-cloudflare-origin-ca
        image: curlimages/curl:8.11.0
        command:
          - sh
          - -c
          - cat /etc/ssl/certs/ca-certificates.crt /cloudflare-origin-ca/origin-ca-root.pem > /ca-bundle/ca-certificates.crt
        volumeMounts:
          - name: cloudflare-origin-ca-root
            mountPath: /cloudflare-origin-ca
          - name: ca-bundle
            mountPath: /ca-bundle
      - name: ensure-postgres-db
        image: postgres:17-alpine
        env:
          - name: PGHOST
            value: "devtools-rds.cdwso8c8c8zk.il-central-1.rds.amazonaws.com"
          - name: PGPORT
            value: "5432"
          - name: ADMIN_USER
            valueFrom:
              secretKeyRef:
                name: rds-admin-credentials
                key: username
          - name: PGPASSWORD
            valueFrom:
              secretKeyRef:
                name: rds-admin-credentials
                key: password
          - name: APP_DB_NAME
            value: "woodpecker"
        command:
          - /bin/sh
          - -c
          - |
            set -eu
            # Every devtool connects to Postgres as the shared RDS admin user
            # (see rds-admin-credentials / woodpecker-db, both sourced from
            # the same SSM params) — no per-tool role, so nothing to CREATE
            # ROLE or GRANT here, just make sure the database itself exists.
            psql -h "$PGHOST" -p "$PGPORT" -U "$ADMIN_USER" -d postgres -v ON_ERROR_STOP=1 -tAc \
              "SELECT 1 FROM pg_database WHERE datname = '$APP_DB_NAME'" | grep -q 1 || \
            psql -h "$PGHOST" -p "$PGPORT" -U "$ADMIN_USER" -d postgres -v ON_ERROR_STOP=1 -c \
              "CREATE DATABASE \"$APP_DB_NAME\" OWNER \"$ADMIN_USER\";"

    # ca-bundle: written by the trust-cloudflare-origin-ca initContainer above,
    # mounted over the main container's own CA file below (subPath, so only that
    # one file is replaced — not the whole /etc/ssl/certs directory).
    # cloudflare-origin-ca-root: the raw cert synced by devtools-provision's
    # templates/trusted-certs.yaml ExternalSecret; only the init container reads it.
    extraVolumes:
      - name: ca-bundle
        emptyDir: {}
      - name: cloudflare-origin-ca-root
        secret:
          secretName: woodpecker-cloudflare-origin-ca-root

    extraVolumeMounts:
      - name: ca-bundle
        mountPath: /etc/ssl/certs/ca-certificates.crt
        subPath: ca-certificates.crt

  agent:
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi

wrapper:
  rdsAdmin:
    usernameSsmParameter: "/devops/terraform-created/rds/admin-username"
    passwordSsmParameter: "/devops/terraform-created/rds/admin-password"

  database:
    host: "devtools-rds.cdwso8c8c8zk.il-central-1.rds.amazonaws.com"

  # Same SSM value argocd/bitbucket/jira/confluence/artifactory already use —
  # see devtools-provision's values.yaml/templates/trusted-certs.yaml.
  trustedCertsSsmParameter: "/devops/terraform-created/cloudflare/origin-ca-root-cert"

  # Bitbucket Data Center forge integration. The client id/secret come from
  # a one-time manual step — Bitbucket has no REST API for Application Link
  # registration:
  #   1. In Bitbucket, go to Administration > Application Links > Create link.
  #   2. Enter https://woodpecker.devopstashtiot.page as the application URL.
  #      Bitbucket won't be able to auto-detect it (no reciprocal link) —
  #      choose "I don't want to reciprocate", type "External Application",
  #      direction "Incoming".
  #   3. Note the generated OAuth client id/secret, then store them:
  #        aws ssm put-parameter --name /devops/postdeploy/woodpecker/bitbucket-client-id     --type SecureString --value "<client-id>"
  #        aws ssm put-parameter --name /devops/postdeploy/woodpecker/bitbucket-client-secret --type SecureString --value "<client-secret>"
  # Until those two SSM parameters exist, the woodpecker-bitbucket-dc-credentials
  # ExternalSecret will fail to sync and the two keys below stay unset —
  # Woodpecker will come up but repos won't list until this step is done.
  bitbucketDcSecrets:
    url: "https://bitbucket.devopstashtiot.page"
    clientIdSsmParameter: "/devops/postdeploy/woodpecker/bitbucket-client-id"
    clientSecretSsmParameter: "/devops/postdeploy/woodpecker/bitbucket-client-secret"
    # Bitbucket Server can't clone over git+https with an OAuth token, so
    # Woodpecker needs a real account's credentials for git operations —
    # reusing the shared admin login here rather than provisioning a
    # dedicated bot account, consistent with every other devtool on this
    # platform sharing /devops/terraform-created/admin/password.
    gitUsername: "admin"
    gitPasswordSsmParameter: "/devops/terraform-created/admin/password"
